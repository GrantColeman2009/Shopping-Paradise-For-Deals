# Render Blueprint — one-click deploy of Shopping Paradise For Deals.
# Render sets PORT automatically; the Dockerfile seeds the demo data on boot.
services:
  - type: web
    name: shopping-paradise-for-deals
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
