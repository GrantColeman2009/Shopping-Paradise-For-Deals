# Render Blueprint — one-click deploy of Shopping Paradise For Deals.
# Render sets PORT automatically; the Dockerfile seeds the demo data on boot.
services:
  - type: web
    name: shopping-paradise-for-deals
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
      # Stripe payments. Set these in the Render dashboard (never commit keys).
      # Start with TEST keys (sk_test_...); switch to live keys only when ready.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Public base URL used for Stripe redirect URLs (defaults to request host).
      - key: PUBLIC_BASE_URL
        value: https://shopping-paradise-for-deals.onrender.com
